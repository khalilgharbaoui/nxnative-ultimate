# Version-independent cheats for nxnative (scripts/cheat_anchor.py, format 1).
# Imported from E0F3CCFAF50065AE.txt on 2026-11-07 with the code of build E0F3CCFAF50065AE. Compile it for a build with
#   cheat_anchor.py compile <this file> --nso <that build's ExeFS/main> -o <cheats folder>
# This source has no anchors, so its entries compile only for build E0F3CCFAF50065AE (update v131072): heap addresses
# cannot be anchored, and the code patches at the end keep their stubs in the padding after the text and their switch
# words in unused .bss, at this build's offsets (cheat_anchor.py import keeps them for this build only for those reasons).
#
# The codes are rainbowkittypaw's, posted on GBAtemp on 2026-11-06 for the Lichii emulator:
#   https://gbatemp.net/threads/cheat-codes-ams-and-sx-os-add-and-request.520293/page-3738#post-10942642
# Each sets one of the game's s32 game-data flags to 9999. This host keeps those flags 0x2000 bytes higher in the heap
# than Lichii does, so every address here is the post's plus 0x2000, and each write is gated on the flag's hash being in
# its slot of the game-data table (README.md, "Cheats").
# The hearts entry after them is not from the post: it was found from the same table (flag 963 is current health, 964
# max health, both in quarter hearts) and tested here. The speed and damage entries at the end are code patches found
# on this host (README.md, "Cheats"); the three speed call sites are the ones afiaka87's oots2-release
# "faster-movement-extra" doubles (MIT, https://github.com/afiaka87/oots2-release).
#
# Free camera by UserDerezzed (https://github.com/UserDerezzed).
# The free camera writes the game's code at fixed addresses and indexes its stores by register 0, so it compiles only for
# build E0F3CCFAF50065AE (update v131072). It patches code (a cave in the text's zero padding and six hooks), so it runs
# on the Mac only: the iPhone's code pages are the app's signed pages (docs/reference/cheats.md).

#
# God mode by UserDerezzed (https://github.com/UserDerezzed). Its on entry writes the game's code at fixed addresses
# and indexes its stores by register 0, so the pair compiles only for build E0F3CCFAF50065AE (update v131072). It
# patches code (a cave in the text's zero padding and one hook), so it runs on the Mac only: the iPhone's code pages
# are the app's signed pages (docs/reference/cheats.md).
#
# Map select by UserDerezzed (https://github.com/UserDerezzed).
# Each location is applied once (once = true: the panel's Apply). It writes the location's strings and a flag into the
# unused end of main's .bss (main+0x4E9FF20-0x4E9FFBF), a cave into the text's zero padding (main+0x3C46E70-0x3C46FBB,
# around the god mode cave at main+0x3C46F00) and the cave's hook (main+0x3303CA0), all as main-relative words of one
# build, so everything here compiles only for build E0F3CCFAF50065AE (update v131072). It patches code, so it runs on
# the Mac only: the iPhone's code pages are the app's signed pages.
#
# Live cheats by XIIYAZ (https://github.com/XIIYAZ), for build E0F3CCFAF50065AE (update v131072). Every value cheat writes two
# places: the save image (heap+0x5A4DA5D8 + the entry's offset in progress.sav; the game reads it only when an area loads, so
# the value survives the next save) and the live game data, so it shows at once: int records of 40 bytes (value +0x1C, copy
# +0x20) from heap+0x7F374AC8, bool records of 24 bytes (+0x16, +0x17) from heap+0x7F31F418, bottle enum records of 56 bytes
# from heap+0x7F398638, and the list of pending changes (12-byte value / name hash / flags entries from heap+0x7F380F80) that
# reads take before the records. Live writes run only while the live hash table's rupee slot is where it was found and the
# record's fixed words match. The heap addresses are this build's, so the value cheats compile for it only.
# Hearts are Link's own (his status object writes them into the game data every frame): the health pair hooks the status
# update (main+0xBABFF0) to a cave at main+0x3C46FC0 (0x3C46FC0-0x3C46FDF, after the map select cave; XIIYAZ authored it at 0x3C46F40, which the map
# select cave already holds here, so the cave and its two branches are moved) that sets max and hearts to 20 before it runs; off puts the pacibsp back.
# Several entries are over the 256 words a Switch accepts per cheat, and the health pair writes code: Mac host only.

